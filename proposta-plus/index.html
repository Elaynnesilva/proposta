    <!--
      Ícone do app instalado (área de trabalho e celular). O favicon acima só vale para a aba
      do navegador; ao instalar, Android/Chrome/Edge leem o ícone do manifest, e o iPhone lê o
      apple-touch-icon. Sem esses dois, cada aparelho inventava um ícone (letra genérica ou print
      da página). O desenho é o mesmo do favicon: P+ terracota sobre grafite.
      O iPhone e o ícone "maskable" do Android são quadrados cheios, sem cantos arredondados,
      porque o próprio aparelho recorta no formato dele — canto transparente viraria borda preta.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#28313C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Proposta+" />
